<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --surface2: #edf1f7;
    --border: rgba(42,92,143,0.12);
    --border-hover: rgba(42,92,143,0.28);
    --text: #1a2433;
    --text-muted: #4a5a70;
    --text-dim: #8a9ab0;
    --accent: #2a5c8f;
    --accent-light: #4a9eca;
    --accent2: #1a8f6a;
    --tag-bg: #d0e1f0;
    --tag-text: #1a3d60;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
    --serif: 'Noto Serif JP', serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    min-height: 100vh;
  }

  /* 細かいドットパターン（和紙風） */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, rgba(42,92,143,0.06) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── Nav ── */
  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(245,247,250,0.92);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
  }

  .nav-logo {
    font-family: var(--serif);
    font-size: 15px;
    color: var(--accent);
    letter-spacing: 0.08em;
    font-weight: 400;
  }

  .nav-right { display: flex; align-items: center; gap: 2rem; }

  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a {
    font-size: 13px;
    color: var(--text-muted);
    text-decoration: none;
    font-family: var(--mono);
    letter-spacing: 0.04em;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--accent); }

  .lang-switch {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .lang-btn {
    font-family: var(--mono);
    font-size: 12px;
    padding: 4px 12px;
    cursor: pointer;
    background: transparent;
    border: none;
    color: var(--text-muted);
    transition: all 0.15s;
    letter-spacing: 0.05em;
  }
  .lang-btn.active { background: var(--accent); color: #fff; }
  .lang-btn:not(.active):hover { color: var(--accent); }

  /* ── Main ── */
  main { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 0 2rem; }
  section { padding: 5rem 0; }
  #hero { padding-top: 7rem; padding-bottom: 4rem; }

  .hero-label {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent2);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 1.2rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .hero-label::before {
    content: '';
    display: inline-block;
    width: 20px;
    height: 1px;
    background: var(--accent2);
  }

  .hero-name {
    font-family: var(--serif);
    font-size: clamp(2.6rem, 6vw, 4.2rem);
    font-weight: 300;
    line-height: 1.1;
    letter-spacing: 0.01em;
    margin-bottom: 0.3rem;
    color: var(--text);
  }
  .hero-name span { color: var(--accent); }

  .hero-title {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 2rem;
    line-height: 2;
    border-left: 2px solid var(--border-hover);
    padding-left: 1rem;
  }

  .hero-bio {
    max-width: 560px;
    font-size: 15px;
    color: var(--text-muted);
    line-height: 1.9;
    margin-bottom: 2.5rem;
  }

  .hero-links { display: flex; gap: 1rem; flex-wrap: wrap; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 1.4rem;
    border-radius: 6px;
    font-size: 13px;
    font-family: var(--mono);
    text-decoration: none;
    transition: all 0.2s;
    cursor: pointer;
    border: none;
    letter-spacing: 0.03em;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #1a4a7a; }
  .btn-outline {
    background: var(--surface);
    color: var(--text-muted);
    border: 1px solid var(--border-hover);
  }
  .btn-outline:hover { color: var(--accent); border-color: var(--accent); background: var(--surface2); }

  /* ── Section heading ── */
  .section-heading {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 2.5rem;
  }
  .section-heading h2 {
    font-size: 11px;
    font-family: var(--mono);
    font-weight: 400;
    color: var(--text-dim);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .section-heading::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── Skills ── */
  .skills-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .skill-cell {
    background: var(--surface);
    padding: 1.2rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    transition: background 0.2s;
  }
  .skill-cell:hover { background: var(--surface2); }
  .skill-category {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .skill-items { font-size: 13px; color: var(--text-muted); line-height: 1.7; }

  /* ── Projects ── */
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
    gap: 1.2rem;
  }
  .project-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.5rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
    position: relative;
    overflow: hidden;
  }
  .project-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .project-card:hover {
    border-color: var(--border-hover);
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(42,92,143,0.08);
  }
  .project-card:hover::before { opacity: 1; }

  .project-number { font-family: var(--mono); font-size: 10px; color: var(--text-dim); letter-spacing: 0.1em; }
  .project-title { font-size: 15px; font-weight: 500; color: var(--text); line-height: 1.4; }
  .project-desc { font-size: 13px; color: var(--text-muted); line-height: 1.75; flex: 1; }
  .project-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.4rem; }
  .tag {
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 4px;
    background: var(--tag-bg);
    color: var(--tag-text);
    letter-spacing: 0.02em;
  }
  .project-arrow { font-family: var(--mono); font-size: 12px; color: var(--accent); margin-top: 0.4rem; }

  /* ── Modal ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,36,51,0.55);
    backdrop-filter: blur(6px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border-hover);
    border-radius: 14px;
    max-width: 680px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 2.5rem;
    position: relative;
    box-shadow: 0 20px 60px rgba(42,92,143,0.15);
  }

  .modal-close {
    position: absolute;
    top: 1.2rem; right: 1.2rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 32px; height: 32px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    font-family: var(--sans);
  }
  .modal-close:hover { color: var(--accent); border-color: var(--accent); }

  .modal-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent2);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 0.6rem;
  }
  .modal-title {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 400;
    color: var(--text);
    line-height: 1.35;
    margin-bottom: 1.5rem;
  }
  .modal-section-title {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    margin-top: 1.5rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--border);
  }
  .modal-text { font-size: 14px; color: var(--text-muted); line-height: 1.85; }
  .modal-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.6rem; }
  .modal-links {
    display: flex; gap: 0.8rem; flex-wrap: wrap;
    margin-top: 1.8rem; padding-top: 1.5rem;
    border-top: 1px solid var(--border);
  }

  /* Video embed */
  .modal-video {
    margin-top: 1.5rem;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    aspect-ratio: 16/9;
    background: var(--surface2);
    border: 1px solid var(--border);
  }
  .modal-video iframe { width: 100%; height: 100%; border: none; display: block; }

  /* ── Contact ── */
  #contact { padding-bottom: 6rem; }
  .contact-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .contact-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-light));
  }
  .contact-box h3 {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 300;
    margin-bottom: 0.8rem;
    color: var(--text);
  }
  .contact-box p { color: var(--text-muted); font-size: 14px; margin-bottom: 2rem; }
  .contact-links { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }

  /* ── Footer ── */
  footer {
    position: relative; z-index: 1;
    border-top: 1px solid var(--border);
    padding: 1.5rem 2rem;
    text-align: center;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
  }
</style>
</head>

let currentLang = 'en';

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.toLowerCase() === lang);
  });
  document.documentElement.lang = lang;
  const t = i18n[lang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key] !== undefined) {
      if (t[key].includes('\n')) {
        el.innerHTML = t[key].split('\n').map(line => `<div>${line}</div>`).join('');
      } else {
        el.textContent = t[key];
      }
    }
  });
  renderProjects();
}

function renderProjects() {
  const grid = document.getElementById('projects-grid');
  const t = i18n[currentLang];
  grid.innerHTML = Object.entries(projects).map(([id, p]) => {
    const d = p[currentLang];
    return `
      <div class="project-card" onclick="openModal('${id}')">
        <div class="project-number">${d.label}</div>
        <div class="project-title">${d.title}</div>
        <div class="project-desc">${d.desc}</div>
        <div class="project-tags">${p.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>
        <div class="project-arrow">${t.card_detail}</div>
      </div>
    `;
  }).join('');
}

function getEmbedUrl(url) {
  if (!url) return null;
  const ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  if (ytMatch) return `https://www.youtube.com/embed/${ytMatch[1]}`;
  const vimeoMatch = url.match(/vimeo\.com\/(\d+)/);
  if (vimeoMatch) return `https://player.vimeo.com/video/${vimeoMatch[1]}`;
  return null;
}

function openModal(id) {
  const p = projects[id];
  if (!p) return;
  const d = p[currentLang];
  const t = i18n[currentLang];
  const embedUrl = getEmbedUrl(p.video);
  const videoHtml = embedUrl ? `
    <div class="modal-section-title">${t.modal_video}</div>
    <div class="modal-video">
      <iframe src="${embedUrl}" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
    </div>` : '';
  const links = `
    ${p.github ? `<a href="${p.github}" class="btn btn-outline" target="_blank">GitHub →</a>` : ''}
    ${p.demo ? `<a href="${p.demo}" class="btn btn-primary" target="_blank">Demo →</a>` : ''}
  `;
  document.getElementById('modal-body').innerHTML = `
    <div class="modal-label">${d.label}</div>
    <div class="modal-title">${d.title}</div>
    ${videoHtml}
    <div class="modal-section-title">${t.modal_overview}</div>
    <div class="modal-text">${d.overview}</div>
    <div class="modal-section-title">${t.modal_challenge}</div>
    <div class="modal-text">${d.challenge}</div>
    <div class="modal-section-title">${t.modal_result}</div>
    <div class="modal-text">${d.result}</div>
    <div class="modal-section-title">${t.modal_tech}</div>
    <div class="modal-tags">${p.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>
    ${(p.github || p.demo) ? `<div class="modal-links">${links}</div>` : ''}
  `;
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
  const iframe = document.querySelector('.modal-video iframe');
  if (iframe) iframe.src = iframe.src;
}
function closeModalOnOverlay(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

setLang('en');
</script>
