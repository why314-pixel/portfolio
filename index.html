// ── 言語切り替え ─────────────────────────────────────────────
let currentLang = 'en';

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.toLowerCase() === lang);
  });
  document.documentElement.lang = lang;
  const t = i18n[lang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key] !== undefined) {
      // \n を改行として扱う（hero-titleなど）
      if (t[key].includes('\n')) {
        el.innerHTML = t[key].split('\n').map(line => `<div>${line}</div>`).join('');
      } else {
        el.textContent = t[key];
      }
    }
  });
  renderProjects();
}

function renderProjects() {
  const grid = document.getElementById('projects-grid');
  const t = i18n[currentLang];
  grid.innerHTML = Object.entries(projects).map(([id, p]) => {
    const d = p[currentLang];
    return `
      <div class="project-card" onclick="openModal('${id}')">
        <div class="project-number">${d.label}</div>
        <div class="project-title">${d.title}</div>
        <div class="project-desc">${d.desc}</div>
        <div class="project-tags">${p.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>
        <div class="project-arrow">${t.card_detail}</div>
      </div>
    `;
  }).join('');
}

function openModal(id) {
  const p = projects[id];
  if (!p) return;
  const d = p[currentLang];
  const t = i18n[currentLang];
  const links = `
    ${p.github ? `<a href="${p.github}" class="btn btn-outline" target="_blank">GitHub →</a>` : ''}
    ${p.demo ? `<a href="${p.demo}" class="btn btn-primary" target="_blank">Demo →</a>` : ''}
  `;
  document.getElementById('modal-body').innerHTML = `
    <div class="modal-label">${d.label}</div>
    <div class="modal-title">${d.title}</div>
    <div class="modal-section-title">${t.modal_overview}</div>
    <div class="modal-text">${d.overview}</div>
    <div class="modal-section-title">${t.modal_challenge}</div>
    <div class="modal-text">${d.challenge}</div>
    <div class="modal-section-title">${t.modal_result}</div>
    <div class="modal-text">${d.result}</div>
    <div class="modal-section-title">${t.modal_tech}</div>
    <div class="modal-tags">${p.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>
    ${(p.github || p.demo) ? `<div class="modal-links">${links}</div>` : ''}
  `;
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}
function closeModalOnOverlay(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// 初期描画（英語）
setLang('en');
</script>
</body>
</html>
